<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDASIR CLOUD SCANNER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500&display=swap');
        
        body { background: #000; color: #00ff00; font-family: 'Rajdhani', sans-serif; text-align: center; margin: 0; overflow-x: hidden; }
        
        /* Security Login Screen */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .login-box { border: 2px solid #00ff00; padding: 40px; border-radius: 20px; box-shadow: 0 0 25px #00ff00; background: rgba(0,20,0,0.9); }
        .login-box h2 { font-family: 'Orbitron'; color: #00ff00; margin-bottom: 20px; letter-spacing: 2px; }

        /* App Content */
        #app-content { display: none; }
        .header { background: #00ff00; color: #000; padding: 15px; font-family: 'Orbitron', sans-serif; font-weight: bold; box-shadow: 0 0 20px #00ff00; }
        
        .timer-container {
            background: rgba(255, 0, 0, 0.1); border: 2px solid #ff0000;
            display: inline-block; padding: 10px 25px; margin: 20px 0;
            border-radius: 10px; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }
        #timer-display { font-family: 'Orbitron', sans-serif; font-size: 30px; color: #ff3333; text-shadow: 0 0 10px #ff0000; }

        .box { border: 2px solid #00ff00; padding: 25px; border-radius: 20px; max-width: 650px; margin: 10px auto; background: rgba(0,25,0,0.95); box-shadow: 0 0 30px rgba(0,255,0,0.2); }
        input { width: 85%; padding: 15px; margin: 15px 0; background: #000; border: 2px solid #00ff00; color: #00ff00; border-radius: 10px; font-size: 20px; text-align: center; outline: none; font-family: 'Orbitron'; }
        
        .btn { padding: 12px 25px; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; font-family: 'Orbitron'; transition: 0.3s; margin: 5px; text-transform: uppercase; outline: none; }
        .search-btn { background: #00ff00; color: #000; width: 85%; font-size: 18px; }
        .search-btn:hover { background: #00cc00; transform: scale(1.02); }
        
        .map-btn { background: #4285F4; color: white; font-size: 14px; }
        .map-btn-red { background: #ff0000; color: white; font-size: 14px; box-shadow: 0 0 15px #ff0000; }
        .pdf-btn { background: #ff4444; color: white; font-size: 14px; }

        .action-container { display: none; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; border: 1px solid #00ff00; background: #000; margin-top: 15px; }
        th, td { border: 1px solid #00ff00; padding: 12px; text-align: left; font-size: 17px; }
        th { color: #ff3333; background: rgba(0,255,0,0.1); width: 35%; }
        
        .signature-area { margin-top: 30px; font-family: 'Orbitron', sans-serif; font-size: 13px; color: #00ff00; border-top: 1px solid #00ff00; padding-top: 10px; }

        /* Expiry Screen */
        #expiry-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; color: red; z-index: 11000; flex-direction: column;
            justify-content: center; align-items: center; font-family: 'Orbitron';
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2><i class="fas fa-lock"></i> SYSTEM LOCKED</h2>
        <input type="password" id="pass-input" placeholder="ENTER SECURITY CODE">
        <br>
        <button class="btn search-btn" onclick="checkPass()">LOGIN SYSTEM</button>
        <p id="login-error" style="color: #ff3333; display: none; margin-top: 15px; font-weight: bold;">ACCESS DENIED: WRONG CODE</p>
    </div>
</div>

<div id="expiry-screen">
    <i class="fas fa-user-clock" style="font-size: 80px; margin-bottom: 20px;"></i>
    <h1>TRIAL EXPIRED</h1>
    <p>Your 5-minute session has ended.</p>
    <p style="font-size: 12px; color: #444;">Contact Admin Mudasir for full access.</p>
</div>

<div id="app-content">
    <div class="header">🛰️ MUDASIR CLOUD SCANNER V4.0 🛰️</div>
    
    <div class="timer-container">
        <span style="color: #fff; font-size: 11px; display: block; font-family: 'Orbitron'; margin-bottom: 5px;">SESSION TIME LEFT</span>
        <div id="timer-display">05:00</div>
    </div>

    <div class="box">
        <h2><i class="fas fa-satellite"></i> SYSTEM DECRYPTOR</h2>
        <input type="text" id="search-input" placeholder="ENTER NUMBER OR CNIC...">
        <button class="btn search-btn" onclick="processSearch()">DECRYPT DATA</button>
        
        <div id="result-area"></div>

        <div id="actions" class="action-container">
            <button class="btn" id="map-btn-dynamic" onclick="openMap()"></button>
            <button class="btn pdf-btn" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> PDF DATA</button>
        </div>

        <div class="signature-area">
            VERIFIED BY: <span style="font-size: 16px;">MUDASIR</span> <span style="color: #00bcff;"><i class="fas fa-check-circle"></i></span>
        </div>
    </div>
</div>

<script>
    // Records Database
    // Format: [Name, Number, CNIC, Address, MapLink, FatherName, Cast]
    const database = [
        ["SAHIL RASHEED", "03247026751", "32303-0000001", "Chah Hayat Wala, Khar", "http://google.com/maps", "N/A", "N/A"],
        ["MUHAMMAD ASLAM", "03080489093", "3120131503125", "DAAK KHANA WAHI JOGYAN NAND PURA TEHSIL L BAHAWALPUR GPO", "http://google.com/maps", "N/A", "N/A"],
        ["RIAZ KHAN", "03473223897", "3610353581745", "GALAI NUMBER 2 KHANEWAL KOHNA TEHSIL DISTRICT KH", "http://google.com/maps", "N/A", "N/A"],
        ["MUHAMMAD ARIF", "3082588050", "3230384272379", "CHAH BAGRHI WALA DAAK KHANA SANANWAAN PATTI DAIYA CHOKHA TEHSIL KOT ADDU DISTRICT MUZAFFAR GARH", "http://google.com/maps", "N/A", "N/A"],
        ["SALMAN KHAN", "03001234567", "32303-9999999", "Cah sohry wala pathan family", "http://google.com/maps", "AFZAL HUSSAIN", "PATHAN"]
    ];

    let current = null;
    let timerStarted = false;

    // Security Password Logic
    function checkPass() {
        const pass = document.getElementById("pass-input").value;
        if (pass === "786mudasir") {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-content").style.display = "block";
            if (!timerStarted) {
                startFiveMinuteTimer();
                timerStarted = true;
            }
        } else {
            const err = document.getElementById("login-error");
            err.style.display = "block";
            setTimeout(() => { err.style.display = "none"; }, 3000);
        }
    }

    // 5-Minute Timer Logic
    function startFiveMinuteTimer() {
        let timeLeft = 5 * 60;
        const timerDisplay = document.getElementById("timer-display");
        
        const countdown = setInterval(() => {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            timerDisplay.innerText = `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                document.getElementById("expiry-screen").style.display = "flex";
                document.getElementById("app-content").style.display = "none";
            }
            timeLeft--;
        }, 1000);
    }

    // Search Logic
    function processSearch() {
        const val = document.getElementById("search-input").value.trim();
        const area = document.getElementById("result-area");
        const actions = document.getElementById("actions");
        const mapBtn = document.getElementById("map-btn-dynamic");
        
        const res = database.find(r => r[1] === val || r[2].replace(/-/g, "").includes(val.replace(/-/g, "")));

        if(res) {
            current = res;
            area.innerHTML = `<table>
                <tr><th>NAME</th><td>${res[0]}</td></tr>
                <tr><th>FATHER NAME</th><td>${res[5]}</td></tr>
                <tr><th>CAST</th><td>${res[6]}</td></tr>
                <tr><th>NUMBER</th><td>${res[1]}</td></tr>
                <tr><th>CNIC</th><td>${res[2]}</td></tr>
                <tr><th>LOCATION</th><td>${res[3]}</td></tr>
            </table>`;
            
            if(res[0].includes("RIAZ")) {
                mapBtn.className = "btn map-btn-red";
            } else {
                mapBtn.className = "btn map-btn";
            }
            mapBtn.innerHTML = `<i class="fas fa-map-marked-alt"></i> SEE ON GOOGLE MAP`;
            actions.style.display = "block";
        } else {
            current = null;
            area.innerHTML = "<p style='color:red; margin-top:20px; font-weight:bold;'>🚫 RECORD NOT FOUND IN CLOUD</p>";
            actions.style.display = "none";
        }
    }

    // Map Redirect
    function openMap() {
        if(current && current[4]) {
            window.open(current[4], '_blank');
        }
    }

    // PDF Export
    function downloadPDF() {
        if(!current) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFillColor(0, 0, 0); doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(0, 255, 0); doc.setFontSize(22); doc.text("MUDASIR CLOUD DATA", 40, 25);
        doc.setTextColor(0, 0, 0); doc.setFontSize(14);
        doc.text(`NAME: ${current[0]}`, 20, 60);
        doc.text(`FATHER: ${current[5]}`, 20, 70);
        doc.text(`CAST: ${current[6]}`, 20, 80);
        doc.text(`NUMBER: ${current[1]}`, 20, 90);
        doc.text(`CNIC: ${current[2]}`, 20, 100);
        doc.text(`ADDRESS: ${current[3]}`, 20, 110);
        doc.save(`Record_${current[1]}.pdf`);
    }
</script>
</body>
</html>
