<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDASIR CLOUD SCANNER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500&display=swap');
        
        body { background: #000; color: #00ff00; font-family: 'Rajdhani', sans-serif; text-align: center; margin: 0; }
        .header { background: #00ff00; color: #000; padding: 15px; font-family: 'Orbitron', sans-serif; font-weight: bold; box-shadow: 0 0 20px #00ff00; }
        
        /* Prominent Timer Styling */
        .timer-container {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            display: inline-block;
            padding: 10px 25px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }
        #timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: #ff3333;
            text-shadow: 0 0 8px #ff0000;
        }

        .box { border: 2px solid #00ff00; padding: 25px; border-radius: 20px; max-width: 650px; margin: 10px auto; background: rgba(0,20,0,0.95); box-shadow: 0 0 30px rgba(0,255,0,0.3); }
        input { width: 85%; padding: 15px; margin: 15px 0; background: #000; border: 2px solid #00ff00; color: #00ff00; border-radius: 10px; font-size: 20px; text-align: center; outline: none; }
        .btn { padding: 12px 25px; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; font-family: 'Orbitron', sans-serif; transition: 0.3s; margin: 5px; text-transform: uppercase; display: inline-block; text-decoration: none; }
        .search-btn { background: #00ff00; color: #000; width: 85%; font-size: 18px; margin-bottom: 20px; }
        .map-btn { background: #4285F4; color: white; font-size: 14px; }
        .map-btn-red { background: #ff0000; color: white; font-size: 14px; }
        .pdf-btn { background: #ff4444; color: white; font-size: 14px; }
        
        .action-container { display: none; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; border: 1px solid #00ff00; background: #000; }
        th, td { border: 1px solid #00ff00; padding: 12px; text-align: left; font-size: 17px; }
        th { color: #ff3333; background: rgba(0,255,0,0.1); width: 35%; }
        
        .signature-area { margin-top: 30px; font-family: 'Orbitron', sans-serif; font-size: 13px; color: #00ff00; border-top: 1px solid #00ff00; padding-top: 10px; }
        
        #expiry-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black; color: red;
            z-index: 9999; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>

<div id="expiry-screen">
    <i class="fas fa-user-slash" style="font-size: 80px; margin-bottom: 20px;"></i>
    <h1>ACCESS EXPIRED</h1>
    <p>System auto-locked after 24 hours.</p>
</div>

<div class="header">🛰️ MUDASIR CLOUD SCANNER V4.0 🛰️</div>

<div class="container" id="app-content">
    <div class="timer-container">
        <span style="color: #fff; font-size: 12px; display: block; margin-bottom: 5px; font-family: 'Orbitron';">TIME REMAINING</span>
        <div id="timer-display">24:00:00</div>
    </div>

    <div class="box">
        <h2><i class="fas fa-satellite"></i> SYSTEM DECRYPTOR</h2>
        <input type="text" id="search-input" placeholder="ENTER NUMBER OR CNIC...">
        <button class="btn search-btn" onclick="processSearch()">DECRYPT DATA</button>
        
        <div id="result-area"></div>

        <div id="actions" class="action-container">
            <button class="btn" id="map-btn-dynamic" onclick="openMap()"></button>
            <button class="btn pdf-btn" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> PDF DATA</button>
        </div>

        <div class="signature-area">
            VERIFIED BY: <span style="font-size: 16px;">MUDASIR</span> <span style="color: #00bcff;"><i class="fas fa-check-circle"></i></span>
        </div>
    </div>
</div>

<script>
    const database = [
        ["SAHIL RASHEED", "03247026751", "32303-0000001", "Chah Hayat Wala, Khar", "https://www.google.com/maps/search/$"],
        ["MUHAMMAD ASLAM", "03080489093", "3120131503125", "DAAK KHANA WAHI JOGYAN NAND PURA TEHSIL L BAHAWALPUR GPO", "https://maps.app.goo.gl/J78uJxK7tJR7H7rz7"],
        ["RIAZ KHAN", "03473223897", "3610353581745", "GALAI NUMBER 2 KHANEWAL KOHNA TEHSIL DISTRICT KH", "https://maps.app.goo.gl/vtrcaCHYzD2yabFE7"]
    ];

    let current = null;

    // --- 24 HOUR PERSISTENT TIMER LOGIC ---
    const TOTAL_TIME = 24 * 60 * 60; 

    function initTimer() {
        let startTime = localStorage.getItem('mudasir_start_time');
        if (!startTime) {
            startTime = Date.now();
            localStorage.setItem('mudasir_start_time', startTime);
        }

        setInterval(() => {
            let currentTime = Date.now();
            let elapsed = Math.floor((currentTime - startTime) / 1000);
            let timeLeft = TOTAL_TIME - elapsed;

            if (timeLeft <= 0) {
                document.getElementById("expiry-screen").style.display = "flex";
                document.getElementById("app-content").style.display = "none";
                localStorage.removeItem('mudasir_start_time');
            } else {
                updateTimerDisplay(timeLeft);
            }
        }, 1000);
    }

    function updateTimerDisplay(seconds) {
        let h = Math.floor(seconds / 3600);
        let m = Math.floor((seconds % 3600) / 60);
        let s = seconds % 60;
        h = h < 10 ? "0" + h : h; m = m < 10 ? "0" + m : m; s = s < 10 ? "0" + s : s;
        document.getElementById("timer-display").innerText = `${h}:${m}:${s}`;
    }

    window.onload = initTimer;

    function processSearch() {
        const val = document.getElementById("search-input").value.trim();
        const area = document.getElementById("result-area");
        const actions = document.getElementById("actions");
        const mapBtn = document.getElementById("map-btn-dynamic");
        
        const res = database.find(r => r[1] === val || r[2].replace(/-/g, "").includes(val.replace(/-/g, "")));

        if(res) {
            current = res;
            area.innerHTML = `<table>
                <tr><th>NAME</th><td>${res[0]}</td></tr>
                <tr><th>NUMBER</th><td>${res[1]}</td></tr>
                <tr><th>CNIC</th><td>${res[2]}</td></tr>
                <tr><th>LOCATION</th><td>${res[3]}</td></tr>
            </table>`;
            
            // RIAZ KHAN ke liye Red button, baaki ke liye Blue
            mapBtn.className = (res[0] === "RIAZ KHAN") ? "btn map-btn-red" : "btn map-btn";
            mapBtn.innerHTML = `<i class="fas fa-map-marked-alt"></i> SEE ON GOOGLE MAP`;
            
            actions.style.display = "block";
        } else {
            current = null;
            area.innerHTML = "<p style='color:red;'>🚫 RECORD NOT FOUND</p>";
            actions.style.display = "none";
        }
    }

    function openMap() {
        if(current && current[4] !== "") {
            window.open(current[4], '_blank');
        }
    }

    function downloadPDF() {
        if(!current) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFillColor(0, 0, 0); doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(0, 255, 0); doc.setFontSize(22); doc.text("MUDASIR CLOUD DATA SLIP", 40, 25);
        doc.setTextColor(0, 0, 0); doc.setFontSize(14);
        doc.text(`FULL NAME: ${current[0]}`, 20, 60);
        doc.text(`MOBILE NO: ${current[1]}`, 20, 70);
        doc.text(`CNIC NO: ${current[2]}`, 20, 80);
        doc.save(`Record_${current[1]}.pdf`);
    }
</script>
</body>
</html>
